<!DOCTYPE html><!--
Version: v3.3
Description: 個人支出記錄系統純前端網頁。升級至 v3.3，清理舊有失效 GAS API URL，將預設連線欄位保持為空以保護個人隱私，準備發布至 GitHub Pages 免費靜態託管。
-->

<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚗 愛車支出記錄系統</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --ios-bg: #000000;             /* iOS 暗色模式純黑底色 */
      --ios-card: #1c1c1e;           /* iOS 經典卡片背景 */
      --ios-card-secondary: #2c2c2e; /* iOS 次級卡片/輸入框背景 */
      --ios-blue: #0a84ff;           /* Apple 經典藍 */
      --ios-gold: #ffd60a;           /* Apple 金色：強調與按鈕 */
      --ios-gold-hover: #ffcc00;     
      --ios-gray-light: #f2f2f7;     /* 亮文字 */
      --ios-gray-muted: #8e8e93;     /* 輔助灰 */
      --ios-border: #38383a;         /* 極細分隔線 */
      --ios-danger: #ff453a;         /* 警示紅 */
      --ios-success: #30d158;        /* 成功綠 */
      
      --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.5);
      --transition-ios: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--ios-bg);
      max-width: 100vw;
      overflow-x: hidden; /* 徹底杜絕橫向滑動問題 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "SF Pro Text", "Segoe UI", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      color: var(--ios-gray-light);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    .container {
      max-width: 600px; /* 限制固定手機寬度頁面 */
      margin: 0 auto;
      padding: 16px;
      width: 100%;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 8px 0;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title i {
      color: var(--ios-gold);
    }

    .btn-settings {
      background-color: var(--ios-card);
      color: var(--ios-gray-light);
      border: 1px solid var(--ios-border);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: var(--transition-ios);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-settings:hover {
      background-color: var(--ios-card-secondary);
    }

    /* Setup Alert */
    .setup-alert {
      background-color: rgba(255, 69, 58, 0.12);
      border: 1px solid var(--ios-danger);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: #ff9f0a;
      font-size: 13px;
    }

    .setup-alert i {
      font-size: 18px;
      margin-top: 2px;
    }

    /* Apple風格 卡片 */
    .card {
      background-color: var(--ios-card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--ios-border);
      transition: var(--transition-ios);
      width: 100%;
    }

    /* 可摺疊卡片標題樣式 */
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      user-select: none;
    }

    .card-title.collapsible {
      cursor: pointer;
    }

    .card-title-left {
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 4px solid var(--ios-gold);
      padding-left: 8px;
    }

    .card-title-left i {
      color: var(--ios-gold);
    }

    .collapse-arrow {
      font-size: 13px;
      color: var(--ios-gray-muted);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .collapse-arrow.collapsed {
      transform: rotate(-90deg);
    }

    /* 摺疊內容容器 */
    .card-body {
      margin-top: 16px;
      transition: max-height 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.25s ease;
      overflow: hidden;
      max-height: 800px; /* 足夠大的預設展開高度 */
      opacity: 1;
    }

    .card-body.collapsed {
      max-height: 0 !important;
      opacity: 0 !important;
      margin-top: 0 !important;
      pointer-events: none;
    }

    /* 儀表板 Layout - 手機版固定為 1fr */
    .dashboard-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 16px;
      width: 100%;
    }

    /* 數據總覽 */
    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--ios-border);
    }

    .stat-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .stat-label {
      font-size: 14px;
      color: var(--ios-gray-muted);
    }

    .stat-value {
      font-size: 19px;
      font-weight: 700;
      color: var(--ios-gold);
      font-family: 'Arial', sans-serif;
    }

    /* 預算進度條 */
    .budget-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--ios-border);
    }

    .budget-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .budget-progress-bar {
      height: 8px;
      background-color: var(--ios-card-secondary);
      border-radius: 4px;
      overflow: hidden;
    }

    .budget-progress-fill {
      height: 100%;
      background-color: var(--ios-gold);
      border-radius: 4px;
      width: 0%;
      transition: width 0.5s ease-in-out;
    }

    /* 圖表容器 */
    .chart-container {
      position: relative;
      width: 100%;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* iOS 經典分組表單 */
    .ios-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ios-input-group {
      background-color: var(--ios-card-secondary);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--ios-border);
    }

    .ios-form-row {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--ios-border);
    }

    .ios-form-row:last-child {
      border-bottom: none;
    }

    .ios-form-row label {
      width: 110px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ios-gray-light);
    }

    .ios-form-row input, .ios-form-row select {
      flex: 1;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      text-align: right;
      font-family: inherit;
      width: 100%;
    }

    .ios-form-row input[type="date"], .ios-form-row input[type="number"] {
      font-family: 'Arial', sans-serif;
    }

    .ios-form-row input::placeholder {
      color: var(--ios-gray-muted);
    }

    /* 快捷輔助區 */
    .helper-section {
      margin-top: 8px;
    }

    .helper-title {
      font-size: 11px;
      color: var(--ios-gray-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quick-tag-btn {
      background-color: var(--ios-card-secondary);
      border: 1px solid var(--ios-border);
      color: var(--ios-gray-light);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition-ios);
    }

    .quick-tag-btn:hover {
      background-color: var(--ios-border);
      border-color: var(--ios-gold);
    }

    .btn-submit {
      background-color: var(--ios-gold);
      color: #000000;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-ios);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(255, 214, 10, 0.15);
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: var(--ios-gold-hover);
    }

    /* iOS 經典分頁跳轉按鈕 */
    .btn-navigation-row {
      background-color: var(--ios-card);
      border: 1px solid var(--ios-border);
      color: #ffffff;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 24px;
      box-shadow: var(--shadow-soft);
      transition: var(--transition-ios);
    }

    .btn-navigation-row:hover {
      background-color: var(--ios-card-secondary);
    }

    /* iOS 導覽列 Navbar (明細頁專用) */
    .ios-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--ios-border);
      position: sticky;
      top: 0;
      background-color: var(--ios-bg);
      z-index: 100;
      width: 100%;
    }

    .navbar-back-btn {
      background: none;
      border: none;
      color: var(--ios-blue);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
    }

    .navbar-title {
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
    }

    .navbar-action-btn {
      background: none;
      border: none;
      color: var(--ios-gold);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
    }

    /* 分類管理 (設定 Modal 專用) */
    .modal-section-title {
      font-size: 14px;
      font-weight: 600;
      border-top: 1px solid var(--ios-border);
      padding-top: 15px;
      margin-bottom: 10px;
      color: var(--ios-gold);
    }

    .category-scroll {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
      max-height: 100px;
      overflow-y: auto;
      padding: 4px;
      background-color: rgba(0, 0, 0, 0.15);
      border-radius: 6px;
    }

    .category-badge {
      background-color: var(--ios-card-secondary);
      border: 1px solid var(--ios-border);
      color: var(--ios-gray-light);
      padding: 4px 8px;
      border-radius: 14px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .category-badge button {
      background: none;
      border: none;
      color: var(--ios-danger);
      cursor: pointer;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .add-category-input {
      display: flex;
      gap: 6px;
    }

    .btn-add-cat {
      background-color: var(--ios-card-secondary);
      color: var(--ios-gray-light);
      border: 1px solid var(--ios-border);
      padding: 0 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 歷史記錄與篩選 */
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr auto;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
      width: 100%;
    }

    .table-container {
      overflow-x: auto;
      border: 1px solid var(--ios-border);
      border-radius: 12px;
      background-color: rgba(28, 28, 30, 0.7);
      max-height: 500px;
      margin-bottom: 16px;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--ios-border);
    }

    th {
      background-color: #121214;
      color: var(--ios-gold);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .table-input {
      border: none;
      padding: 4px;
      background: transparent;
      width: 100%;
      font-size: 13px;
      color: #ffffff;
      font-family: inherit;
    }

    .btn-delete-row {
      background: none;
      border: none;
      color: var(--ios-danger);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
    }

    .table-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding-top: 8px;
    }

    .btn-save-changes {
      background-color: var(--ios-blue);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-ios);
    }

    /* iOS 彈出框 Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background-color: var(--ios-card);
      border: 1px solid var(--ios-border);
      border-radius: 14px;
      width: 90%;
      max-width: 360px;
      padding: 20px;
      box-shadow: var(--shadow-soft);
      position: relative;
    }

    .modal-header {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--ios-gray-muted);
      cursor: pointer;
    }

    /* iOS 成功勾勾動畫 */
    .success-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .success-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .success-box {
      background-color: var(--ios-card);
      border: 1px solid var(--ios-border);
      border-radius: 20px;
      width: 140px;
      height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-soft);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-overlay.active .success-box {
      transform: scale(1);
    }

    .checkmark-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: block;
      stroke-width: 3;
      stroke: var(--ios-success);
      stroke-miterlimit: 10;
      box-shadow: inset 0px 0px 0px var(--ios-success);
      animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s forwards;
    }

    .checkmark-kick {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
    }

    @keyframes stroke {
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scale {
      0%, 100% { transform: none; }
      50% { transform: scale3d(1.1, 1.1, 1); }
    }
    @keyframes fill {
      100% { box-shadow: inset 0px 0px 0px 30px rgba(48, 209, 88, 0.05); }
    }

    .success-text {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    /* Loading Loader */
    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .loader-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.05);
      border-left-color: var(--ios-gold);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 100px);
      background-color: var(--ios-card);
      border: 1px solid var(--ios-border);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
      z-index: 3000;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      width: max-content;
      max-width: 90%;
    }

    .toast.active {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .toast.success i { color: var(--ios-success); }
    .toast.error i { color: var(--ios-danger); }
  </style>
</head>
<body>

  <!-- 全局 Loading 遮罩 -->
  <div data-hf-id="hf-4h4f" class="loader-overlay" id="loaderOverlay">
    <div data-hf-id="hf-xi6v" class="spinner"></div>
  </div>

  <!-- iOS 成功勾勾動畫 -->
  <div data-hf-id="hf-5s3r" class="success-overlay" id="successOverlay">
    <div data-hf-id="hf-7vb9" class="success-box">
      <svg data-hf-id="hf-om2m" class="checkmark-circle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <path data-hf-id="hf-kzni" class="checkmark-kick" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
      </svg>
      <div data-hf-id="hf-ui56" class="success-text">已完成記帳</div>
    </div>
  </div>

  <!-- Toast 通知提示 -->
  <div data-hf-id="hf-v3kd" class="toast" id="toastMessage">
    <i data-hf-id="hf-aef6" class="fa-solid fa-circle-check"></i>
    <span data-hf-id="hf-y9cr">這是通知訊息</span>
  </div>

  <!-- 📱 主畫面視圖 (Main View) -->
  <div data-hf-id="hf-trpv" id="mainView" class="container">
    <!-- Header -->
    <header data-hf-id="hf-0drs">
      <div data-hf-id="hf-g2nb" class="brand-title">
        <i data-hf-id="hf-32mt" class="fa-solid fa-car"></i> 愛車支出記帳
      </div>
      <button data-hf-id="hf-5e5l" class="btn-settings" onclick="openSettingsModal()">
        <i data-hf-id="hf-rjxs" class="fa-solid fa-gear"></i> 設定
      </button>
    </header>

    <!-- 首次設定引導 -->
    <div data-hf-id="hf-h56o" class="setup-alert" id="setupAlert" style="display: none;">
      <i data-hf-id="hf-0ie2" class="fa-solid fa-circle-info"></i>
      <div data-hf-id="hf-dbw9">
        <strong data-hf-id="hf-8d1j">尚未設定連線！</strong> 請點選右上角「設定」按鈕，輸入 Google Apps Script URL 以連接您的雲端試算表。
      </div>
    </div>

    <!-- 可摺疊卡片：數據總覽 -->
    <div data-hf-id="hf-vn2y" class="card">

  <!-- JavaScript 程式邏輯 -->
  <script>
    // ⚙️ 系統預設設定（可在瀏覽器 UI 輸入並儲存至 LocalStorage，保障隱私）
    const DEFAULT_GAS_API_URL = ""; 
    const DEFAULT_API_TOKEN = "";   // 👈 您可以在網頁面板輸入您的 Token 密碼

    let rawExpenses = [];      // 試算表原始支出資料
    let categoriesList = [];    // 分類
    let chartInstance = null;   // Chart 實例
    let wasModified = false;    // 表格是否被編輯過

    document.addEventListener("DOMContentLoaded", () => {
      // 預設日期設為今天
      document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
      
      // 讀取記憶的里程數
      const savedMileage = localStorage.getItem('last_mileage');
      if (savedMileage) {
        document.getElementById('expMileage').placeholder = `前次里程: ${savedMileage}`;
      }
      
      // 載入預算設定
      let savedBudget = localStorage.getItem('monthly_budget');
      if (!savedBudget) {
        savedBudget = "15000";
        localStorage.setItem('monthly_budget', savedBudget);
      }
      document.getElementById('cfgBudget').value = savedBudget;

      // 載入 API 連線與預設設定優先權
      const apiUrl = localStorage.getItem('gas_api_url') || DEFAULT_GAS_API_URL;
      const apiToken = localStorage.getItem('gas_api_token') || DEFAULT_API_TOKEN;
      
      if (apiUrl && apiToken) {
        document.getElementById('cfgApiUrl').value = apiUrl;
        document.getElementById('cfgToken').value = apiToken;
        
        if (!localStorage.getItem('gas_api_url')) localStorage.setItem('gas_api_url', apiUrl);
        if (!localStorage.getItem('gas_api_token')) localStorage.setItem('gas_api_token', apiToken);

        loadDataFromSheet();
      } else {
        document.getElementById('setupAlert').style.display = 'flex';
        openSettingsModal();
      }
    });

    // 顯示/隱藏 Loading
    function showLoading(show) {
      const loader = document.getElementById('loaderOverlay');
      if (show) loader.classList.add('active');
      else loader.classList.remove('active');
    }

    // 觸發 Apple-style 成功動畫
    function triggerSuccessAnimation() {
      const overlay = document.getElementById('successOverlay');
      overlay.classList.add('active');
      setTimeout(() => {
        overlay.classList.remove('active');
      }, 1500);
    }

    // Toast 提示訊息
    function showToast(message, isSuccess = true) {
      const toast = document.getElementById('toastMessage');
      toast.className = `toast active ${isSuccess ? 'success' : 'error'}`;
      toast.querySelector('span').textContent = message;
      toast.querySelector('i').className = isSuccess ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-xmark';
      
      setTimeout(() => {
        toast.classList.remove('active');
      }, 3000);
    }

    // Modal 控制
    function openSettingsModal() {
      document.getElementById('settingsModal').classList.add('active');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.remove('active');
      document.getElementById('settingsErrorMsg').style.display = 'none';
    }

    // SPA 頁面切換邏輯
    function switchView(viewId) {
      if (viewId === 'mainView') {
        document.getElementById('mainView').style.display = 'block';
        document.getElementById('detailView').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'instant' });
        loadDataFromSheet(); 
      } else {
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'instant' });
        applyFilters(); 
      }
    }

    // 卡片展開與收回摺疊控制
    function toggleCollapse(bodyId, arrowId) {
      const body = document.getElementById(bodyId);
      const arrow = document.getElementById(arrowId);
      
      body.classList.toggle('collapsed');
      arrow.classList.toggle('collapsed');
    }

    // 儲存連線與預算設定
    async function saveSettings() {
      const url = document.getElementById('cfgApiUrl').value.trim();
      const token = document.getElementById('cfgToken').value.trim();
      const budget = document.getElementById('cfgBudget').value.trim();
      const errorDiv = document.getElementById('settingsErrorMsg');

      if (!url || !token) {
        alert("請完整輸入 GAS Web App URL 與驗證 Token！");
        return;
      }

      errorDiv.style.display = 'none';
      errorDiv.textContent = '';
      showLoading(true);

      try {
        const fetchUrl = `${url}?token=${encodeURIComponent(token)}&action=getData`;
        const response = await fetch(fetchUrl);
        
        if (!response.ok) {
          throw new Error(`HTTP 錯誤: ${response.status}`);
        }
        
        const result = await response.json();

        if (result.status === "success") {
          localStorage.setItem('gas_api_url', url);
          localStorage.setItem('gas_api_token', token);
          if (budget && Number(budget) > 0) {
            localStorage.setItem('monthly_budget', budget);
          }

          rawExpenses = result.expenses || [];
          categoriesList = result.categories || [];
          wasModified = false;
          document.getElementById('btnSaveChanges').style.display = 'none';

          updateCategoriesDropdown();
          updateCategoriesBadges();
          updateDashboardStats();
          renderChart();
          populateExpenseTable(rawExpenses);

          document.getElementById('setupAlert').style.display = 'none';
          closeSettingsModal();
          showToast("連線並同步成功", true);
        } else {
          errorDiv.textContent = `連線失敗: ${result.message}`;
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        console.error(error);
        errorDiv.innerHTML = `連線失敗，請檢查下列事項：<br>
          1. URL 是否複製正確？ (應為 macros/s/.../exec)<br>
          2. GAS 部署的存取權限是否設定為「任何人 (Anyone)」？<br>
          3. 驗證金鑰 (Token) 是否與 GAS 程式碼內一致？<br>
          (原因: ${error.message || '網路異常'})`;
        errorDiv.style.display = 'block';
      } finally {
        showLoading(false);
      }
    }

    // 快捷鍵邏輯：累加金額
    function addAmount(value) {
      const amtInput = document.getElementById('expAmount');
      const current = Number(amtInput.value) || 0;

    function quickFillNote(noteText, defaultCategory) {

        document.getElementById('expCategory').value = defaultCategory;
      }

    // 輔助函數：從備註字串中 Regex 解析里程 Km
    function extractMileage(note) {
      if (!note) return null;
      const match = note.match(/(\d+)\s*(?:km|公里)/i);
      return match ? Number(match[1]) : null;
    }

    // 從 Google Sheets 載入資料 (GET)
    async function loadDataFromSheet() {
      const apiUrl = localStorage.getItem('gas_api_url');
      const apiToken = localStorage.getItem('gas_api_token');

      if (apiUrl === 'demo' || apiToken === 'demo') {
        showLoading(true);

          {"id": 1, "date": "2026-07-28", "category": "油資", "amount": 1200, "note": "[124800 km] 95加滿"},
          {"id": 2, "date": "2026-07-29", "category": "保養", "amount": 4500, "note": "[125000 km] 定期保養"},
          {"id": 3, "date": "2026-07-29", "category": "洗車", "amount": 150, "note": "自助洗車"},
          {"id": 4, "date": "2026-07-30", "category": "停車", "amount": 80, "note": "路邊停車"}
        ];
        categoriesList = ["油資", "保養", "洗車", "停車", "保險", "規費", "其他"];
        wasModified = false;
        document.getElementById('btnSaveChanges').style.display = 'none';

        updateCategoriesBadges();
        updateDashboardStats();
        renderChart();
        populateExpenseTable(rawExpenses);

        showLoading(false);
        return;
      }

      if (!apiUrl || !apiToken) return;

      showLoading(true);
      try {
        const fetchUrl = `${apiUrl}?token=${encodeURIComponent(apiToken)}&action=getData`;
        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error(`HTTP 錯誤: ${response.status}`);
        const result = await response.json();

        if (result.status === "success") {
          rawExpenses = result.expenses || [];
          categoriesList = result.categories || [];
          wasModified = false;
          document.getElementById('btnSaveChanges').style.display = 'none';

          updateCategoriesDropdown();
          updateCategoriesBadges();
          updateDashboardStats();
          renderChart();
          populateExpenseTable(rawExpenses);

          openSettingsModal();

    // 計算用車統計、最新里程、以及平均每公里油資
    function updateDashboardStats() {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = String(now.getMonth() + 1).padStart(2, '0');

      let monthTotal = 0;
      let historyTotal = 0;
      
      let maxMileage = 0;           // 目前最新里程
      const fuelRecords = [];       // 用於油耗/油資分析的加油紀錄

      rawExpenses.forEach(exp => {
        const amount = Number(exp.amount) || 0;
        historyTotal += amount;

        // 計算本月總額
        if (exp.date && exp.date.startsWith(`${currentYear}-${currentMonth}`)) {
          monthTotal += amount;
        }

        // 解析此筆備註中是否含有里程 Km
        const mileage = extractMileage(exp.note);
        if (mileage) {
          if (mileage > maxMileage) {
            maxMileage = mileage;
          }

          // 判斷此筆是否為「油錢」或「加油」類型的支出
          const isFuel = exp.category && 
            (exp.category === "油錢" || exp.category === "加油" || exp.category.includes("油"));
          
          if (isFuel) {
            fuelRecords.push({
              date: exp.date,
              amount: amount,
              mileage: mileage
            });
          }
        }
      });

      // 1. 填入本月與歷史花費
      document.getElementById('monthTotalText').textContent = `$${monthTotal.toLocaleString()}`;
      document.getElementById('historyTotalText').textContent = `$${historyTotal.toLocaleString()}`;

      // 2. 填入目前最新里程
      if (maxMileage > 0) {
        document.getElementById('currentMileageText').textContent = `${maxMileage.toLocaleString()} km`;
      } else {
        document.getElementById('currentMileageText').textContent = `-- km`;
      }

      // 3. 試算平均每公里油資花費
      fuelRecords.sort((a, b) => a.mileage - b.mileage);
      
      if (fuelRecords.length >= 2) {
        const firstFuel = fuelRecords[0];
        const lastFuel = fuelRecords[fuelRecords.length - 1];
        const mileageDiff = lastFuel.mileage - firstFuel.mileage;

        if (mileageDiff > 0) {
          let totalFuelCost = 0;
          for (let i = 1; i < fuelRecords.length; i++) {
            totalFuelCost += fuelRecords[i].amount;
          }
          const costPerKm = (totalFuelCost / mileageDiff).toFixed(2);
          document.getElementById('avgFuelCostText').textContent = `$${costPerKm} / km`;
        } else {
          document.getElementById('avgFuelCostText').textContent = `-- / km`;
        }
      } else {
        document.getElementById('avgFuelCostText').textContent = `需 2 筆里程`;
      }

      // 4. 預算條渲染
      const budgetLimit = Number(localStorage.getItem('monthly_budget')) || 15000;
      const budgetPct = Math.min(Math.round((monthTotal / budgetLimit) * 100), 100);
      
      const fillBar = document.getElementById('budgetProgressBar');
      fillBar.style.width = `${budgetPct}%`;
      document.getElementById('budgetPctText').textContent = `${budgetPct}%`;

      if (budgetPct >= 90) {
        fillBar.style.backgroundColor = 'var(--ios-danger)';
      } else if (budgetPct >= 75) {
        fillBar.style.backgroundColor = '#ff9f0a';
      } else {
        fillBar.style.backgroundColor = 'var(--ios-gold)';
      }
    }

    // 渲染 Chart.js 支出圓餅佔比
    function renderChart() {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      
      const catTotals = {};
      categoriesList.forEach(cat => catTotals[cat] = 0);
      
      rawExpenses.forEach(exp => {
        if (catTotals[exp.category] !== undefined) {
          catTotals[exp.category] += Number(exp.amount) || 0;
        } else if (exp.category) {
          catTotals[exp.category] = (catTotals[exp.category] || 0) + (Number(exp.amount) || 0);
        }
      });

      const labels = [];
      const data = [];
      
      Object.keys(catTotals).forEach(cat => {
        if (catTotals[cat] > 0) {
          labels.push(cat);
          data.push(catTotals[cat]);
        }
      });

      if (chartInstance) chartInstance.destroy();

      if (labels.length === 0) {
        ctx.clearRect(0, 0, 400, 400);
        ctx.fillStyle = '#8e8e93';
        ctx.textAlign = 'center';
        ctx.font = '14px -apple-system';
        ctx.fillText('尚無消費數據可供圖表分析', 150, 100);
        return;
      }

      const colorPalette = [
        '#0a84ff', // 藍
        '#ffd60a', // 金
        '#ff9f0a', // 橘
        '#30d158', // 綠
        '#bf5af2', // 紫
        '#ff453a', // 紅
        '#64d2ff', // 淺藍
        '#8e8e93', // 灰
        '#5e5e62'
      ];

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: colorPalette.slice(0, labels.length),
            borderWidth: 1.5,
            borderColor: '#1c1c1e'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                color: '#f2f2f7',
                boxWidth: 12,
                font: {
                  family: 'Arial',
                  size: 11
                }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const val = context.raw;
                  const total = context.dataset.data.reduce((a, b) => a + b, 0);
                  const pct = ((val / total) * 100).toFixed(1);
                  return ` ${context.label}: $${val.toLocaleString()} (${pct}%)`;
                }
              }
            }
          },
          cutout: '70%'
        }
      });
    }

    // 💡 填充支出明細表格 - 按年份 GroupBy & MM/DD 顯示 & 列點擊彈出編輯視窗
    function populateExpenseTable(data) {
      const tbody = document.getElementById('expenseTableBody');
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--ios-gray-muted); padding: 20px;">無支出記錄</td></tr>';
        document.getElementById('filteredTotalText').textContent = '篩選小計: $0 (0 筆)';
        return;
      }

      // 由近到遠排序
      const sortedData = [...data].sort((a, b) => new Date(b.date) - new Date(a.date));
      let lastYear = null;
      let totalFiltered = 0;

      sortedData.forEach(exp => {
        totalFiltered += Number(exp.amount) || 0;
        
        // 格式化日期：拆分出年份與月/日
        const expDate = new Date(exp.date);
        const year = expDate.getFullYear() || new Date().getFullYear();
        const month = String(expDate.getMonth() + 1).padStart(2, '0');
        const day = String(expDate.getDate()).padStart(2, '0');
        const mmdd = `${month}/${day}`; // 改成 02/06 樣式

        // 💡 1. 插入年份分組列
        if (year !== lastYear) {
          lastYear = year;
          const groupTr = document.createElement('tr');
          groupTr.className = 'year-group-row';
          groupTr.innerHTML = `
            <td colspan="5" style="background-color: #121214; font-weight: 700; color: var(--ios-gold); padding: 6px 12px; font-size: 13px;">
              📅 ${year} 年
            </td>
          `;
          tbody.appendChild(groupTr);
        }

        // 💡 2. 建立資料列 (純文字、點擊行任意處編輯)
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.setAttribute('onclick', `event.target.closest('.btn-delete-row') ? null : openEditRecordModal(${exp.rowNum})`);
        
        tr.innerHTML = `
          <td style="font-family: 'Arial', sans-serif; color: var(--ios-gray-light); font-weight: 500;">${mmdd}</td>
          <td style="color: var(--ios-gray-light); font-weight: 500;">${escapeHtml(exp.category)}</td>
          <td style="font-family: 'Arial', sans-serif; font-weight: 700; color: var(--ios-gold);">$${exp.amount.toLocaleString()}</td>
          <td style="color: var(--ios-gray-muted); font-size: 12px; word-break: break-all;">${escapeHtml(exp.note)}</td>
          <td style="text-align:center; padding: 4px;">
            <button class="btn-delete-row" onclick="handleDeleteRow(${exp.rowNum})" title="刪除">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('filteredTotalText').textContent = `篩選小計: $${totalFiltered.toLocaleString()} (${data.length} 筆)`;
    }

    // 確定修改儲存
    function saveEditedRecord() {
      const rowNum = Number(document.getElementById('editExpRowNum').value);
      const date = document.getElementById('editExpDate').value;
      const category = document.getElementById('editExpCategory').value;
      const amount = Number(document.getElementById('editExpAmount').value) || 0;
      const note = document.getElementById('editExpNote').value.trim();

      if (amount <= 0) {
        alert("金額需大於 0");
        return;
      }

      const index = rawExpenses.findIndex(exp => exp.rowNum === rowNum);
      if (index !== -1) {
        rawExpenses[index].date = date;
        rawExpenses[index].category = category;
        rawExpenses[index].amount = amount;
        rawExpenses[index].note = note;

        wasModified = true;
        document.getElementById('btnSaveChanges').style.display = 'block';

        closeEditRecordModal();
        
        // 更新統計、圖表並重新過濾填表
        updateDashboardStats();
        renderChart();
        applyFilters();
      }

    // 編輯欄位更新值 (表格內直接呼叫，目前主要供刪除或特殊異動)
    function updateRowValue(rowNum, field, value) {
      wasModified = true;
      document.getElementById('btnSaveChanges').style.display = 'block';

      const index = rawExpenses.findIndex(exp => exp.rowNum === rowNum);
      if (index !== -1) {
        if (field === 'amount') {
          rawExpenses[index][field] = Number(value) || 0;
        } else {
          rawExpenses[index][field] = value;
        }
      }
      
      updateDashboardStats();
      renderChart();
    }

    // 刪除表格列
    function handleDeleteRow(rowNum) {
      if (!confirm("確定要刪除這筆支出嗎？需要點選『儲存變更』才會同步至試算表。")) return;
      
      wasModified = true;
      document.getElementById('btnSaveChanges').style.display = 'block';

      rawExpenses = rawExpenses.filter(exp => exp.rowNum !== rowNum);
      
      rawExpenses.forEach((exp, idx) => {
        exp.rowNum = idx + 2;
      });

      applyFilters();
      updateDashboardStats();
      renderChart();
    }

    // 篩選與搜尋
    function applyFilters() {
      const cat = document.getElementById('filterCategory').value;
      const keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();

      let filtered = rawExpenses;

      if (cat !== "ALL") {
        filtered = filtered.filter(exp => exp.category === cat);
      }

      if (keyword) {
        filtered = filtered.filter(exp => exp.note && exp.note.toLowerCase().includes(keyword));
      }

      populateExpenseTable(filtered);
    }

    // 重設篩選器
    function resetFilters() {
      document.getElementById('filterCategory').value = 'ALL';
      document.getElementById('filterKeyword').value = '';
      applyFilters();
    }

    // 新增愛車花費 (POST) - 含里程數合併備註邏輯
    async function handleAddExpense(event) {
      event.preventDefault();
      
      const apiUrl = localStorage.getItem('gas_api_url');
      const apiToken = localStorage.getItem('gas_api_token');

      if (!apiUrl || !apiToken) {
        alert("請先完成連線與設定！");
        return;
      }

      const date = document.getElementById('expDate').value;
      const category = document.getElementById('expCategory').value;
      const amount = Number(document.getElementById('expAmount').value) || 0;
      const mileage = document.getElementById('expMileage').value.trim();
      let note = document.getElementById('expNote').value.trim();

      if (amount <= 0) {
        alert("金額需大於 0");
        return;
      }

      // 里程數與備註處理
      if (mileage) {
        localStorage.setItem('last_mileage', mileage);
        document.getElementById('expMileage').placeholder = `前次里程: ${mileage}`;
        note = `[${mileage} km] ${note}`.trim();
      }

      if (apiUrl === 'demo' || apiToken === 'demo') {
        showLoading(true);
        const newId = rawExpenses.length + 1;
        rawExpenses.unshift({
          id: newId,
          date: date,
          category: category,
          amount: Number(amount),
          note: note
        });

        document.getElementById('expAmount').value = '';
        document.getElementById('expMileage').value = '';
        document.getElementById('expNote').value = '';

        triggerSuccessAnimation();

        setTimeout(async () => {
          updateDashboardStats();
          renderChart();
          populateExpenseTable(rawExpenses);
          showToast("新增成功 (展示模式)", true);
          showLoading(false);
        }, 1000);
        return;
      }

      showLoading(true);
      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          mode: "cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify({
            token: apiToken,
            action: "addExpense",
            date: date,
            category: category,
            amount: amount,
            note: note
          })
        });
        
        const result = await response.json();

        if (result.status === "success") {
          document.getElementById('expAmount').value = '';
          document.getElementById('expMileage').value = '';
          document.getElementById('expNote').value = '';
          
          triggerSuccessAnimation();
          
          setTimeout(async () => {
            await loadDataFromSheet();
          }, 1000);
        } else {
          showToast("新增失敗: " + result.message, false);
        }
      } catch (error) {
        console.error(error);
        showToast("網路異常，無法記帳", false);
      } finally {
        showLoading(false);
      }
    }

    // 一鍵匯出為 CSV 備份
    function exportToCSV() {
      if (rawExpenses.length === 0) {
        alert("尚無資料可供匯出！");
        return;
      }

      const cat = document.getElementById('filterCategory').value;
      const keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();

      let filtered = rawExpenses;
      if (cat !== "ALL") filtered = filtered.filter(exp => exp.category === cat);
      if (keyword) filtered = filtered.filter(exp => exp.note && exp.note.toLowerCase().includes(keyword));

      let csvContent = "\uFEFF"; 
      csvContent += "日期,類別,金額,里程與備註\n";

      const sorted = [...filtered].sort((a, b) => new Date(a.date) - new Date(a.date));
      sorted.forEach(exp => {
        const safeNote = String(exp.note).replace(/,/g, "，");
        csvContent += `${exp.date},${exp.category},${exp.amount},${safeNote}\n`;
      });

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `愛車支出記帳備份_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 輔助防 XSS
    function escapeHtml(string) {
      if (!string) return '';
      return String(string).replace(/[&<>"']/g, function (s) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': '&quot;',
          "'": '&#39;'
        }[s];
      });
    }
  </script>
</body>
</html>
