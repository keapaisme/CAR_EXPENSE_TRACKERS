    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      :root {
        --manga-red: #ff3b30;
        --manga-yellow: #ffd700;        /* 亮黃色 */
        --manga-yellow-dark: #f57f17;   /* 深黃色 */
        --manga-black: #000000;
        --manga-white: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--manga-black);
        font-family: 'Noto Sans TC', sans-serif;
      }
      
      /* 畫布外框，用於固定 1920x1080 解析度，並藉由 JS resize 等比例縮放 */
      #root {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        border: 12px solid var(--manga-white);
        overflow: hidden;
        background: var(--manga-black);
      }

      /* 漫畫背景網點效果 */
      .manga-grid-bg {
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: var(--manga-black);
        background-image: radial-gradient(var(--manga-white) 15%, transparent 16%);
        background-size: 16px 16px;
        opacity: 0.08;
        pointer-events: none;
        z-index: 1;
      }

      /* 滿版幻燈片容器 */
      .slide-full {
        position: absolute;
        width: 100%;
        height: 100%;
        display: block;
        padding: 60px;
        opacity: 0;
        visibility: hidden;
        z-index: 2;
      }

      /* 漫畫分鏡框 (全螢幕背景漫畫) */
      .panel {
        border: 8px solid var(--manga-white);
        background: var(--manga-black);
        position: relative;
        overflow: hidden;
        box-shadow: 12px 12px 0px var(--manga-yellow-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      /* 視覺插圖 */
      .manga-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border: 4px solid var(--manga-black);
      }

      /* 裝飾斜角標籤 (深黃色) */
      .action-badge {
        position: absolute;
        top: 20px;
        left: -10px;
        background: var(--manga-yellow);
        color: var(--manga-black);
        font-family: 'Impact', sans-serif;
        font-weight: 900;
        font-size: 32px;
        padding: 10px 30px;
        transform: rotate(-3deg);
        border: 4px solid var(--manga-black);
        box-shadow: 4px 4px 0px var(--manga-black);
        z-index: 15;
        letter-spacing: 2px;
      }

      /* 浮動疊加在漫畫背景右側的文字層 (去除了外圍大框，大標題自由浮動) */
      .panel-content-overlay {
        position: absolute;
        right: 80px;
        top: 50%;
        transform: translateY(-50%);
        width: 760px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: transparent; /* 移除外圍大框 */
        border: none;
        box-shadow: none;
        padding: 0;
        backdrop-filter: none;
      }

      /* 大標題 (深黃色描邊立體字) */
      .manga-title {
        font-size: 68px;
        font-weight: 900;
        color: var(--manga-white);
        text-shadow: 4px 4px 0px var(--manga-yellow-dark), -2px -2px 0px var(--manga-black), 2px -2px 0px var(--manga-black), -2px 2px 0px var(--manga-black), 2px 2px 0px var(--manga-black);
        margin-bottom: 25px;
        line-height: 1.2;
        letter-spacing: 2px;
      }

      /* 亮點卡片 (44% 透明度半透明內框) */
      .manga-card {
        background: rgba(0, 0, 0, 0.44); /* 44% 透明度 */
        color: var(--manga-white);
        padding: 20px 24px;
        border: 2px solid rgba(255, 215, 0, 0.6); /* 半透明金色邊框 */
        border-radius: 12px;
        margin-bottom: 16px;
        position: relative;
        box-shadow: 4px 4px 0px var(--manga-black);
      }
      .manga-card-title {
        font-size: 28px;
        font-weight: 900;
        margin-bottom: 6px;
        color: var(--manga-yellow); /* 深黃色標題 */
        text-shadow: 2px 2px 0px var(--manga-black);
      }
      .manga-card-text {
        font-size: 20px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--manga-white);
        text-shadow: 1px 1px 2px var(--manga-black);
      }

      /* 全域手機嵌入區域 (支援 3D 透視與動態姿態變換) */
      .phone-container-pip {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 310px;
        height: 620px;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: center center;
        perspective: 1000px;
      }
      .iphone-frame-pip {
        width: 290px;
        height: 580px;
        border: 4px solid #000;
        border-radius: 36px;
        background: #000;
        overflow: hidden;
        position: relative;
        box-shadow: 0px 20px 45px rgba(0, 0, 0, 0.9);
      }
      .iphone-island {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 20px;
        background: #000;
        border-radius: 20px;
        z-index: 10;
        border: 1px solid #333;
      }
      .phone-iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #000;
      }

      /* 底部字幕融入條 (完全無底框，純大字) */
      .subtitle-container {
        position: absolute;
        bottom: 45px;
        left: 50%;
        transform: translateX(-50%);
        width: 1500px;
        min-height: 90px;
        background: transparent; /* 去除黑底框 */
        border: none; /* 去除描邊 */
        padding: 15px 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none; /* 去除陰影 */
        z-index: 100;
      }
      .subtitle-text {
        color: var(--manga-white);
        font-size: 34px;
        font-weight: 900;
        text-align: center;
        line-height: 1.4;
        letter-spacing: 1px;
        text-shadow: 3px 3px 0px var(--manga-black), -2px -2px 0px var(--manga-black), 2px -2px 0px var(--manga-black), -2px 2px 0px var(--manga-black), 2px 2px 0px var(--manga-black);
      }

      /* 播放指示控制條 */
      .preview-controls {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.9);
        border: 3px solid var(--manga-yellow);
        padding: 10px 20px;
        z-index: 999;
        display: flex;
        gap: 15px;
        align-items: center;
        font-size: 14px;
        font-family: monospace;
      }
      .btn-play {
        background: var(--manga-yellow-dark);
        color: var(--manga-black);
        border: 2px solid var(--manga-white);
        padding: 5px 12px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-lang {
        background: var(--manga-white);
        color: var(--manga-black);
        border: 2px solid var(--manga-yellow-dark);
        padding: 5px 12px;
        cursor: pointer;
        font-weight: bold;
      }
    </style>
  </head>
  <body>

    <script>
      // ==================== 1. 視窗自適應等比例縮放 (16:9 YouTube) ====================
      function resizePresentation() {
        const root = document.getElementById('root');
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        root.style.transform = `scale(${scale})`;
        root.style.transformOrigin = 'top left';
        // 置中 Canvas
        const leftOffset = (window.innerWidth - 1920 * scale) / 2;
        const topOffset = (window.innerHeight - 1080 * scale) / 2;
        root.style.left = leftOffset + 'px';
        root.style.top = topOffset + 'px';
        
        document.body.style.width = window.innerWidth + 'px';
        document.body.style.height = window.innerHeight + 'px';
      }
      window.addEventListener('resize', resizePresentation);
      window.addEventListener('load', resizePresentation);

      // ==================== 2. 字幕數據與時間軸設定 (精心微調對齊) ====================
      // 中文字幕
      const subtitlesZh = [
        { time: 0.0, text: "因為愛她，所以養她。" },
        { time: 3.2, text: "但又不曉得錢都花哪去，最好的辦法就是記帳——" },
        { time: 7.2, text: "『愛車支出記帳小程序』！" },
        { time: 10.5, text: "這是一個專門為車主量身打造的輕量化記帳工具，" },
        { time: 14.8, text: "讓你輕鬆掌握愛車的每一筆花費，告別繁瑣，" },
        { time: 18.0, text: "重回駕駛的純粹樂趣。" },

        { time: 20.2, text: "在視覺上，就是極簡。" },
        { time: 23.2, text: "純黑背景搭配深灰卡片，並用細緻的金色作為點綴。" },
        { time: 28.5, text: "去除了生硬的框線，以呼吸感的排版和大圓角展現出高雅質感。" },
        { time: 33.5, text: "每一次記帳成功，還會彈出類似 Apple Pay 的動態打勾回饋，" },
        { time: 37.5, text: "讓記帳也充滿儀式感。" },

        { time: 40.0, text: "除了美觀，功能更是為車主量身定制。" },
        { time: 44.0, text: "系統內建了里程數記憶功能，" },
        { time: 48.0, text: "自動解析備註中的里程，並幫你算出每公里的平均油資。" },
        { time: 53.5, text: "我們還提供了金額與常用備註的快捷鍵，" },
        { time: 59.0, text: "一鍵輸入『九五加滿』或『定期保養』。" },
        { time: 63.5, text: "配合每月的預算進度條，當開銷接近警戒線時，" },
        { time: 67.5, text: "系統會自動亮起紅燈，讓你的荷包不再超支。" },

        { time: 70.9, text: "這款小程式最大的特點在於其無後端架構。" },
        { time: 75.5, text: "我們使用純前端 HTML，直接透過 Google Apps Script 連接你個人的 Google 試算表。" },
        { time: 82.5, text: "這意味著所有數據都牢牢掌握在你自己手中，" },
        { time: 88.5, text: "沒有任何第三方伺服器會洩漏你的隱私。" },
        { time: 93.5, text: "這是一個完全安全、自主，" },
        { time: 98.2, text: "且可以隨時 CSV 一鍵匯出的終極養車記帳方案！" }
      ];

      // 日文字幕
      const subtitlesJa = [
        { time: 0.0, text: "車の維持費は意外とかかります。" },
        { time: 3.5, text: "市販の家計簿アプリは広告が多く、操作も複雑です。" },
        { time: 7.5, text: "そこで開発されたのが、この『愛車支出記録システム』です。" },
        { time: 11.8, text: "ドライバー向けに特化した軽量な設計で、愛車の支出をスマートに管理し、" },
        { time: 16.5, text: "純粋な走りの楽しさを取り戻せます。" },

        { time: 20.2, text: "デザインは極めてシンプルです。" },
        { time: 23.5, text: "iOS風のダークモードを採用し、漆黒の背景にダークグレーのカード、" },
        { time: 28.0, text: "そして上品なゴールドをあしらいました。" },
        { time: 31.5, text: "余白を活かしたレイアウトと丸みのある角で美しく仕上げています。" },
        { time: 35.5, text: "記帳成功時にはApple Payのようなチェックアニメーションが走り、" },
        { time: 38.0, text: "記帳が楽しくなります。" },

        { time: 40.0, text: "機能も車主向けに最適化されています。" },
        { time: 44.0, text: "走行距離の自動記憶機能により、" },
        { time: 48.0, text: "備考欄から距離を解析して1キロあたりの燃料費を算出。" },
        { time: 53.5, text: "さらに、金額や備考のショートカットキーも完備しています。" },
        { time: 59.5, text: "月間予算管理バーは、支出が警戒線に達すると赤く点灯し、" },
        { time: 65.5, text: "無駄遣いを未然に防ぎます。" },

        { time: 70.9, text: "最大の特徴は、サーバーレスな個人直結システムです。" },
        { time: 75.8, text: "純HTMLを使用し、GASを介してご自身のGoogleスプレッドシートに直接接続します。" },
        { time: 82.5, text: "すべてのデータは手元に安全に残り、" },
        { time: 87.5, text: "外部に漏れる心配はありません。" },
        { time: 92.5, text: "安全で自由、" },
        { time: 97.2, text: "CSV一鍵出力も可能な究極の養車ノートです。" }
      ];

      // ==================== 3. 中日雙語音效與切換控制 ====================
      let currentLanguage = 'zh'; // 預設中文

      const audiosZh = [
        { el: document.getElementById('audio1'), start: 0, end: 20.2 },
        { el: document.getElementById('audio2'), start: 20.2, end: 40.0 },
        { el: document.getElementById('audio3'), start: 40.0, end: 70.9 },
        { el: document.getElementById('audio4'), start: 70.9, end: 102.1 }
      ];

      const audiosJa = [
        { el: document.getElementById('audio1_ja'), start: 0, end: 20.2 },
        { el: document.getElementById('audio2_ja'), start: 20.2, end: 40.0 },
        { el: document.getElementById('audio3_ja'), start: 40.0, end: 70.9 },
        { el: document.getElementById('audio4_ja'), start: 70.9, end: 102.1 }
      ];

      function toggleLanguage() {
        // 先暫停當前所有音軌
        audiosZh.forEach(audio => audio.el.pause());
        audiosJa.forEach(audio => audio.el.pause());

        // 切換語言
        currentLanguage = currentLanguage === 'zh' ? 'ja' : 'zh';
        
        // 更新 UI
        const btn = document.getElementById('btn-lang');
        if (currentLanguage === 'zh') {
          btn.textContent = "LANG: ZH (中文)";
          btn.style.background = "#ffffff";
          btn.style.color = "#000000";
        } else {
          btn.textContent = "LANG: JA (日本語)";
          btn.style.background = "#ffd700";
          btn.style.color = "#000000";
        }

        // 即時同步一次
        onTimelineUpdate();
      }

      function onTimelineUpdate() {
        if (typeof tl === 'undefined') return;
        const time = tl.time();
        document.getElementById('time-display').textContent = time.toFixed(2);

        // A. 同步當前語言音軌
        syncAudioTrack(time);

        // B. 同步當前語言字幕
        syncSubtitles(time);

        // C. 動態操作 iframe
        syncIFrameDemo(time);
      }

      function syncAudioTrack(time) {
        const activeAudios = currentLanguage === 'zh' ? audiosZh : audiosJa;
        const inactiveAudios = currentLanguage === 'zh' ? audiosJa : audiosZh;

        // 停止非活動語系的所有音軌
        inactiveAudios.forEach(audio => {
          if (!audio.el.paused) {
            audio.el.pause();
            audio.el.currentTime = 0;
          }
        });

        // 找到當前應該播放的活動音軌
        let activeIndex = -1;
        for (let i = 0; i < activeAudios.length; i++) {
          if (time >= activeAudios[i].start && time < activeAudios[i].end) {
            activeIndex = i;
            break;
          }
        }

        activeAudios.forEach((audio, index) => {
          if (index === activeIndex) {
            const offset = time - audio.start;
            if (typeof tl !== 'undefined' && !tl.paused()) {
              if (audio.el.paused) {
                audio.el.play().catch(() => {});
              }
              if (Math.abs(audio.el.currentTime - offset) > 0.3) {
                audio.el.currentTime = offset;
              }
            } else {
              audio.el.pause();
              audio.el.currentTime = offset;
            }
          } else {
            if (!audio.el.paused) {
              audio.el.pause();
              audio.el.currentTime = 0;
            }
          }
        });
      }

      function syncSubtitles(time) {
        const activeList = currentLanguage === 'zh' ? subtitlesZh : subtitlesJa;
        let activeText = "";
        for (let i = activeList.length - 1; i >= 0; i--) {
          if (time >= activeList[i].time) {
            activeText = activeList[i].text;
            break;
          }
        }
        document.getElementById('subtitle-box').textContent = activeText;
      }

      // 📱 實時手機畫面時間段控制 (可隨喜好自由指定 offset 或固定起始點)
      window.appDemoTimeOffset = 0;   // 時間偏移量 (預設 0s 完全跟隨)
      window.appDemoFixedStart = null; // 預設 null，自動從 Slide 2 (20.2s) 一路順暢放至 Slide 3

      // 提供給 console 或設定全域呼叫的控制函數
      function setPhoneDemoTime(offset = 0, fixedStart = null) {
        window.appDemoTimeOffset = offset;
        window.appDemoFixedStart = fixedStart;
        console.log(`📱 手機畫面演練時間已更新: offset=${offset}s, fixedStart=${fixedStart}`);
      }

      function syncIFrameDemo(time) {
        try {
          const iframe = document.getElementById('appFrame');
          const iframeWin = iframe ? iframe.contentWindow : null;
          if (iframeWin) {
            let phoneTime = time;
            // 若有設定 fixedStart，則在進入 Slide 2 (20.2s) 後從 fixedStart 秒開始放
            if (window.appDemoFixedStart !== null) {
              phoneTime = window.appDemoFixedStart + Math.max(0, time - 20.2);
            } else {
              phoneTime = time + window.appDemoTimeOffset;
            }
            phoneTime = Math.max(0, phoneTime);

            const appTimeEl = document.getElementById('app-time-display');
            if (appTimeEl) appTimeEl.textContent = phoneTime.toFixed(2);

            iframeWin.postMessage({ action: 'syncTime', time: phoneTime }, '*');
          }
        } catch (e) {
          console.warn("IFrame postMessage error:", e);
        }
      }

      // ==================== 4. GSAP 主時間軸與幻燈片切換 ====================
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({
        paused: true,
        onUpdate: onTimelineUpdate
      });

      tl.to({}, { duration: 102.1 });

      // Slide 1 Show (滿版漫畫 + 右側文字浮動)
      tl.set("#slide1", { display: "block", visibility: "visible", opacity: 1 }, 0);
      tl.to("#slide1", { opacity: 0, duration: 0.5 }, 19.7);
      tl.set("#slide1", { display: "none", visibility: "hidden" }, 20.2);

      // Slide 2 Show (滿版漫畫 + 把真實手機操作畫面調整角度/大小，100% 精確重合套入漫畫手機畫面)
      tl.set("#slide2", { display: "block", visibility: "visible", opacity: 0 }, 20.2);
      tl.to("#slide2", { opacity: 1, duration: 0.5 }, 20.2);
      
      // 對齊漫畫手持巨型手機
      tl.set("#pipPhone", {
        x: "-46%",
        y: "-29%",
        rotation: -9,
        rotationY: 0,
        scale: 1.85,
        visibility: "visible",
        opacity: 0
      }, 20.2);
      tl.to("#pipPhone", { opacity: 1, duration: 0.6 }, 20.2);

      // 時刻 39.0s：旋轉歸零，手機平滑滑動回右下角懸浮位置
      tl.to("#pipPhone", {
        x: "600px",
        y: "-20px",
        rotation: 0,
        rotationY: 0,
        scale: 1,
        duration: 1.0,
        ease: "power2.inOut"
      }, 39.0);

      tl.to("#slide2", { opacity: 0, duration: 0.5 }, 39.5);
      tl.set("#slide2", { display: "none", visibility: "hidden" }, 40.0);

      // Slide 3 結束 (70.4s)：手機平滑移動至 Slide 4 左下方 (x: -580px, y: 120px)，讓左側呈現程式演練
      tl.to("#pipPhone", {
        x: "-580px",
        y: "120px",
        rotation: 0,
        rotationY: 0,
        scale: 0.92,
        duration: 1.0,
        ease: "power2.inOut"
      }, 70.4);

      // Slide 4 Show (滿版漫畫 + 右側文字浮動 + 左下方手機實時演示)
      tl.set("#slide4", { display: "block", visibility: "visible", opacity: 0 }, 70.9);
      tl.to("#slide4", { opacity: 1, duration: 0.5 }, 70.9);

      // 第 4 頁結束時 (101.5s) 淡出手機
      tl.to("#pipPhone", { opacity: 0, duration: 0.5 }, 101.5);
      tl.set("#pipPhone", { visibility: "hidden" }, 102.0);

      window.__timelines["main"] = tl;

      // ==================== 5. 播放控制 (預覽用) ====================
      function togglePlay() {
        const activeAudios = currentLanguage === 'zh' ? audiosZh : audiosJa;
        if (tl.paused()) {
          // 先啟動所有音軌的 context 避免瀏覽器擋音訊
          activeAudios.forEach(audio => {
            audio.el.play().then(() => audio.el.pause()).catch(()=>{});
          });
          tl.play();
        } else {
          tl.pause();
          audiosZh.forEach(audio => audio.el.pause());
          audiosJa.forEach(audio => audio.el.pause());
        }
      }

      // 點擊背景任何地方也能 toggle
      document.body.addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'IFRAME') {
          togglePlay();
        }
      });
    </script>
  </body>
